<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="seoT seoD">
  <title id="seoT">SEO Audit and Monitoring Dashboard architecture diagram</title>
  <desc id="seoD">Playwright crawler behind FastAPI stores measured data in TimescaleDB and a Next.js inspector shows a ranked issue list with a how-to-fix guide.</desc>
  <rect x="0" y="0" width="1600" height="900" fill="#17171A"/>
  <rect x="40" y="40" width="1520" height="820" fill="none" stroke="#2A2A30" stroke-width="3"/>
  <rect x="80" y="90" width="90" height="8" fill="#E8590C"/>
  <text x="80" y="170" font-family="Inter, system-ui, sans-serif" font-size="52" font-weight="800" fill="#EDEDEF">SEO Audit + Monitoring Dashboard</text>
  <text x="80" y="215" font-family="ui-monospace, Consolas, monospace" font-size="26" fill="#A0A0A8">Architecture diagram — free tools only, measured data only</text>

  <g font-family="ui-monospace, Consolas, monospace" font-size="27" fill="#EDEDEF" text-anchor="middle">
    <rect x="80" y="320" width="300" height="130" rx="8" fill="#1C1C20" stroke="#E8590C" stroke-width="3"/>
    <text x="230" y="375">Playwright</text><text x="230" y="410" font-size="21" fill="#A0A0A8">crawler</text>
    <rect x="450" y="320" width="300" height="130" rx="8" fill="#1C1C20" stroke="#E8590C" stroke-width="3"/>
    <text x="600" y="375">FastAPI</text><text x="600" y="410" font-size="21" fill="#A0A0A8">API + scheduler</text>
    <rect x="820" y="320" width="300" height="130" rx="8" fill="#1C1C20" stroke="#2A2A30" stroke-width="2"/>
    <text x="970" y="375">TimescaleDB</text><text x="970" y="410" font-size="21" fill="#A0A0A8">history + trends</text>
    <rect x="1190" y="320" width="330" height="130" rx="8" fill="#1C1C20" stroke="#2A2A30" stroke-width="2"/>
    <text x="1355" y="375">Next.js inspector</text><text x="1355" y="410" font-size="21" fill="#A0A0A8">DevTools-style view</text>
  </g>
  <g stroke="#3A3A42" stroke-width="3" fill="none">
    <line x1="380" y1="385" x2="446" y2="385"/><polygon points="446,375 462,385 446,395" fill="#3A3A42" stroke="none"/>
    <line x1="750" y1="385" x2="816" y2="385"/><polygon points="816,375 832,385 816,395" fill="#3A3A42" stroke="none"/>
    <line x1="1120" y1="385" x2="1186" y2="385"/><polygon points="1186,375 1202,385 1186,395" fill="#3A3A42" stroke="none"/>
  </g>
  <g font-family="ui-monospace, Consolas, monospace" font-size="24" fill="#A0A0A8" text-anchor="middle">
    <rect x="80" y="560" width="440" height="80" rx="8" fill="#1C1C20" stroke="#2A2A30" stroke-width="2"/><text x="300" y="610">Ranked issue list</text>
    <rect x="545" y="560" width="440" height="80" rx="8" fill="#1C1C20" stroke="#2A2A30" stroke-width="2"/><text x="765" y="610">How-to-fix guide per issue</text>
    <rect x="1010" y="560" width="510" height="80" rx="8" fill="#1C1C20" stroke="#2A2A30" stroke-width="2"/><text x="1265" y="610">No estimated numbers on screen</text>
  </g>
  <text x="80" y="740" font-family="ui-monospace, Consolas, monospace" font-size="24" fill="#A0A0A8">Crawls pages on a schedule, stores every measurement, surfaces what to fix first.</text>
</svg>
